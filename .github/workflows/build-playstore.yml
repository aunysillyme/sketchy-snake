name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Sync Capacitor Android
        run: npm run sync:android

      - name: Build Android App Bundle (AAB)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sketchy-snake-release.keystore
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure the replacement release keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password secret}"
          : "${ANDROID_KEY_ALIAS:?Missing key alias secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password secret}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Remove temporary signing material
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sketchy-snake-release.keystore
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v7
        with:
          name: SketchySnake-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
